controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # base_rotation_controller:
    #   type: position_controllers/JointPositionController
    #   joint: base_rotation_joint
    #   pid: {p: 100.0, i: 1.0, d: 10.0}

    # arm_height_controller:
    #   type: position_controllers/JointPositionController
    #   joint: arm_height_joint
    #   pid: {p: 100.0, i: 1.0, d: 10.0}

    # arm_rotation_controller:
    #   type: position_controllers/JointPositionController
